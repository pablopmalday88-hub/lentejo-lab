<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Compact version for small sizes -->
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b794f6" />
      <stop offset="100%" style="stop-color:#4fd1c5" />
    </linearGradient>
  </defs>
  
  <!-- Simple dog head silhouette -->
  <circle cx="32" cy="28" r="16" fill="url(#icon-gradient)" />
  
  <!-- Ears -->
  <ellipse cx="20" cy="22" rx="7" ry="12" fill="url(#icon-gradient)" opacity="0.8" transform="rotate(-20 20 22)" />
  <ellipse cx="44" cy="22" rx="7" ry="12" fill="url(#icon-gradient)" opacity="0.8" transform="rotate(20 44 22)" />
  
  <!-- Snout -->
  <ellipse cx="32" cy="38" rx="10" ry="8" fill="url(#icon-gradient)" opacity="0.7" />
  
  <!-- Eyes glow -->
  <circle cx="27" cy="27" r="2" fill="#4fd1c5" />
  <circle cx="37" cy="27" r="2" fill="#4fd1c5" />
  
  <!-- Nose -->
  <ellipse cx="32" cy="40" rx="3" ry="2.5" fill="#0a0a0f" />
</svg>
