<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐕 Lentejo Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <div class="logo">🐕</div>
      <h1>Lentejo Lab</h1>
      <p class="subtitle">Acceso privado</p>
      <input type="password" id="password-input" placeholder="Contraseña" />
      <button id="login-btn">Entrar</button>
      <div id="login-error" class="error-message"></div>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-content">
        <h1 class="logo-text">🐕 Lentejo Lab</h1>
        <button id="logout-btn" class="logout-btn">Salir</button>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <div class="stats-dashboard">
      <div class="stat-card">
        <div class="stat-icon">💡</div>
        <div class="stat-value" id="stat-active">0</div>
        <div class="stat-label">Activas</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Completadas</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-value" id="stat-percentage">0%</div>
        <div class="stat-label">Ejecutadas</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 Buscar ideas..." />
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="active">Activas</button>
        <button class="filter-btn" data-filter="completed">Historial</button>
      </div>
      <div class="category-filters" id="category-filters"></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="ideas">💡 Ideas</button>
      <button class="tab" data-tab="posts">🔖 Posts</button>
    </div>

    <!-- Ideas View -->
    <div class="tab-content active" id="ideas">
      <div id="ideas-list" class="items-grid"></div>
    </div>

    <!-- Posts View -->
    <div class="tab-content" id="posts">
      <div id="posts-list" class="items-grid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
